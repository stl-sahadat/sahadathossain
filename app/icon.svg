<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Cyber Hexagonal / Octagonal Frame -->
  <polygon
    points="18,4 46,4 60,18 60,46 46,60 18,60 4,46 4,18"
    fill="#080B12"
    stroke="#00F0FF"
    stroke-width="2.5"
  />
  <!-- Corner Circuit Notches -->
  <path
    d="M10,18 L18,10 M54,18 L46,10 M10,46 L18,54 M54,46 L46,54"
    stroke="#00F0FF"
    stroke-width="1.8"
    opacity="0.65"
  />
  <!-- Outer Corner Pips -->
  <circle cx="18" cy="4" r="1.5" fill="#00F0FF" />
  <circle cx="46" cy="4" r="1.5" fill="#00F0FF" />
  <circle cx="46" cy="60" r="1.5" fill="#00F0FF" />
  <circle cx="18" cy="60" r="1.5" fill="#00F0FF" />
  <!-- Bold Stylized Cyber 'S' Monogram -->
  <path
    d="M 44 20 L 25 20 C 20.5 20 17 23.5 17 27.5 C 17 31.5 20.5 34 25 34 L 39 35 C 43.5 35 47 37.5 47 41.5 C 47 45.5 43.5 49 39 49 L 20 49"
    stroke="#00F0FF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Inner Circuit Core -->
  <circle cx="32" cy="34.5" r="2.5" fill="#00F0FF" />
</svg>
